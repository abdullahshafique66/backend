# One-click deploy on Render: Dashboard → New → Blueprint → pick this repo.
# Creates the API (free web service) and a free PostgreSQL database, already connected.
services:
  - type: web
    name: apna-hisab-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: apna-hisab-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # Render asks for this: your Vercel link, e.g. https://apna-hisaab-kitaab.vercel.app
      - key: TIMEZONE
        value: Asia/Karachi
      - key: SEED_DEMO
        value: "true"

databases:
  - name: apna-hisab-db
    plan: free
    databaseName: apna_hisab
    user: apna
